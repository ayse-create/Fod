<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐱 100 Hızında Kedi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #f0f0f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #game { position: relative; width: 100vw; height: 100vh; max-width: 800px; max-height: 800px; background: #f0f0f0; border-radius: 24px; overflow: hidden; border: 2px solid #e0e0e0; }
    #cat { position: fixed; pointer-events: none; z-index: 999; font-size: 48px; transform: translate(-50%, -50%); }
    #info { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2000; font-size: 18px; font-weight: 600; color: #333; background: rgba(255,255,255,0.8); padding: 8px 20px; border-radius: 30px; backdrop-filter: blur(4px); border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="cat">🐱</div>
  <div id="info">⚡ Kedi 100 hızında koşuyor!</div>

  <script>
    const cat = document.getElementById('cat');
    let catX = 100, catY = 100;
    let speedX = 5, speedY = 3; // 100 hızı hissi için yüksek hareket

    function update() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      catX += speedX * 1.5;
      catY += speedY * 1.5;

      // Duvarlardan sektirme
      if (catX > w - 40 || catX < 40) speedX *= -1;
      if (catY > h - 40 || catY < 40) speedY *= -1;

      cat.style.left = catX + 'px';
      cat.style.top = catY + 'px';

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
